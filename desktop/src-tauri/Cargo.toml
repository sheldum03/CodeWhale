[package]
name = "codewhale-desktop"
version = "0.1.0"
description = "CodeWhale Windows desktop workbench"
authors = ["CodeWhale"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
